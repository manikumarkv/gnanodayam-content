name: CI
# Every content PR (e.g. an intern's Keystatic branch) must pass before merge:
# each "Know more" doc must convert into a doc the app accepts, and the site must build.
on:
  pull_request:
  push:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Content checks (app schema + sourcing rules)
        run: pnpm test
      - name: Build
        run: pnpm build
